[package]
name = "a7r5-desktop"
version = "0.1.0"
edition = "2021"
description = "A7R5 本地研究工具测试版"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sha-crypt = { version = "=0.5.0", default-features = false }
libc = "=0.2.190"
uuid = { version = "=1.28.0", features = ["v4"] }
tempfile = "=3.27.0"
anyhow = "=1.0.104"

[profile.release]
strip = "debuginfo"
lto = true
codegen-units = 1

[profile.release.build-override]
strip = false
opt-level = 0
